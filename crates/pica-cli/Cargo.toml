[package]
name = "pica-cli"
authors.workspace = true
categories = ["parser-implementations"]
description = "A command-line tool for processing PICA+ records."
edition.workspace = true
keywords = ["cli", "pica+", "code4lib"]
license.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
default = ["performant"]
nightly = ["pica-record/nightly"]
performant = ["pica-record/performant"]
unstable = ["pica-record/unstable"]

[dependencies]
bstr = { version = "1.13.1" }
clap_complete = { version = "4.6.11" }
clap = { version = "4.6.7", features = ["derive", "cargo", "wrap_help"] }
csv = { version = "1.4.0" }
directories = { version = "6.0.0" }
flate2 = { version = "1.1.10" }
hashbrown = { version = "0.17.1", features = ["serde"] }
indicatif = { version = "0.18.6", features = ["improved_unicode"] }
jiff = { version = "0.2.38" }
pica-record = { path = "../../", features = ["serde"] }
quick-xml = { version = "0.42.0" }
rand = { version = "0.10.3" }
regex = { version = "1.13.1" }
serde_json = { version = "1.0.154" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { version = "2.0.21" }
toml = { version = "1.1.8", features = ["preserve_order"] }
unicode-normalization = { version = "0.1.26" }

[dev-dependencies]
anyhow = { version = "1.0.104" }
assert_cmd = { version = "2.2.2" }
assert_fs = { version = "1.1.4" }
predicates = { version = "3.1.4" }

[[bin]]
path = "src/main.rs"
name = "pica"

[[test]]
path = "tests/integration.rs"
name = "integration"
